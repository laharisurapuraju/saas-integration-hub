services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://hub:hub@db:5432/hub
      API_KEY: ${API_KEY:-change-me}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
